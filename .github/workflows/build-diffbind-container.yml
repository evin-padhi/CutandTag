name: Build DiffBind container

on:
  push:
    branches:
      - main
      - codex/differential-binding-inputs
    paths:
      - 'bin/diffbind_analysis.R'
      - 'envs/diffbind.yml'
      - 'containers/diffbind/Dockerfile'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/evin-padhi/cutandtag-diffbind
          tags: |
            type=raw,value=diffbind-0.1.0
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/diffbind/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
